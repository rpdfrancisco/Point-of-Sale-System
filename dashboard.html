<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Water Refill POS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <h2>Welcome, <span id="username"></span>!</h2>
        <p>Email: <span id="useremail"></span></p>
        <p>Role: <span id="userrole"></span></p>

        <div id="admin-panel" class="role-panel">
            <h3>Admin Panel</h3>
            <button onclick="window.location.href='manage-users.html'">Manage Users</button>
            <button onclick="window.location.href='reports.html'">View Reports</button>
        </div>

        <div id="cashier-panel" class="role-panel">
            <h3>Cashier Panel</h3>
            <button onclick="window.location.href='pos.html'">Open POS System</button>
            <button onclick="window.location.href='reports.html'">View Sales</button>
        </div>

        <div id="customer-panel" class="role-panel">
            <h3>Customer Panel</h3>
        </div>

        <button id="logoutBtn">Logout</button>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
